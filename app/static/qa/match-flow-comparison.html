<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>匿名匹配流程 · 视觉一致性 QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #12110e; color: #fff; font-family: "Microsoft YaHei UI", sans-serif; }
    main { width: min(100% - 48px, 1500px); margin: 0 auto; padding: 40px 0 56px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 32px; border-bottom: 3px solid #ffe45c; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 32px; }
    header p { max-width: 680px; margin: 0; color: #d7d2c1; line-height: 1.6; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 28px; }
    figure { min-width: 0; margin: 0; }
    figcaption { min-height: 58px; margin-bottom: 12px; color: #ffe45c; font-weight: 800; }
    figcaption span { display: block; margin-top: 4px; color: #d7d2c1; font-size: 12px; font-weight: 500; }
    img { width: 100%; height: auto; display: block; border: 3px solid #fff; background: #fbf7e8; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>视觉语言基线 × 新匹配流程</h1>
      <p>prototypes/prototype2.0.html 仅提供状态流。视觉真值继续使用现有品牌基线；本板用于同时检查字体、纸面、粗边框、硬阴影、状态色和移动端密度。</p>
    </header>
    <section class="board" aria-label="设计 QA 同屏比较">
      <figure><figcaption>视觉基线<span>既有 390px 首页</span></figcaption><img src="mobile-home.png" alt="既有手机首页视觉基线"></figure>
      <figure><figcaption>01 待匹配<span>新 390px 准备状态</span></figcaption><img src="match-flow-ready-mobile-390.png" alt="手机端匹配准备页"></figure>
      <figure><figcaption>02 匹配中<span>新 390px 三阶段状态</span></figcaption><img src="match-flow-searching-mobile-390.png" alt="手机端匹配计算页"></figure>
      <figure><figcaption>03 结果<span>新 390px 单个匿名结果</span></figcaption><img src="match-flow-result-mobile-390.png" alt="手机端匹配结果页"></figure>
    </section>
  </main>
</body>
</html>
