<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile QA Montage</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #12110e; color: #fff; font-family: Arial, "Microsoft YaHei UI", sans-serif; padding: 18px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 21px; }
    p { margin: 0; color: #cfc9b8; font-size: 12px; }
    main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    figure { min-width: 0; margin: 0; overflow: hidden; border: 4px solid #fff; border-radius: 18px; background: #fff8e7; box-shadow: 7px 7px 0 #5b48ff; }
    figcaption { border-bottom: 4px solid #12110e; background: #ffe45c; color: #12110e; font-size: 13px; font-weight: 900; padding: 8px 10px; }
    img { display: block; width: 100%; height: 760px; object-fit: cover; object-position: top center; }
  </style>
</head>
<body>
  <header><h1>MOBILE SYSTEM / 390 × 844</h1><p>Home · Profile · Chat composer · Event detail</p></header>
  <main>
    <figure><figcaption>01 / 首页</figcaption><img src="mobile-home.png" alt="Mobile home"></figure>
    <figure><figcaption>02 / 我的标签</figcaption><img src="mobile-profile.png" alt="Mobile profile"></figure>
    <figure><figcaption>03 / 会话输入</figcaption><img src="mobile-chat.png" alt="Mobile chat composer"></figure>
    <figure><figcaption>04 / 饭局详情</figcaption><img src="mobile-event.png" alt="Mobile event detail"></figure>
  </main>
</body>
</html>
