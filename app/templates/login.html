{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
  <section class="auth-layout" aria-labelledby="login-title">
    <div class="auth-story">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>让认识发生得<br>慢一点，真一点。</h1>
      <p>登录后继续查看你的真实标签、匿名匹配和饭局进度。</p>
      <ul class="auth-promises"><li>原始行为数据不对外展示</li><li>每一步解锁都有明确边界</li><li>危险场景可以随时举报和退出</li></ul>
    </div>
    <div class="auth-form-panel">
      <div class="form-heading"><p class="eyebrow">账号访问</p><h2 id="login-title">登录</h2><p>使用你的注册邮箱继续。</p></div>
      <form method="post" action="{{ url_for('auth.login') }}">
        <label for="login-email">邮箱地址<input id="login-email" required type="email" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com"></label>
        <label for="login-password">密码<input id="login-password" required type="password" name="password" autocomplete="current-password" placeholder="至少 8 位"></label>
        <button class="button button-block" type="submit">登录</button>
      </form>
      <div class="form-divider"><span>或快速体验</span></div>
      <form method="post" action="{{ url_for('auth.demo_login') }}"><button class="button secondary button-block" type="submit">使用预置演示账号</button></form>
      <p class="form-switch">没有账号？<a class="text-link" href="{{ url_for('auth.register') }}">创建匿名账号</a></p>
    </div>
  </section>
{% endblock %}
